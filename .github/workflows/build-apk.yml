name: Build APK

# Build APK otomatis tanpa Android Studio: aapt2 + ecj + d8 + apksigner.
# Hasil: artifact "unrepost-apk" (APK debug siap instal).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ambil toolchain (aapt2, ecj, d8, apksigner)
        run: bash tools/fetch-toolchain.sh

      - name: Unit test mesin deteksi
        run: bash tools/test.sh

      - name: Build APK
        run: bash tools/build-apk.sh

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: unrepost-apk
          path: dist/*.apk
          if-no-files-found: error
