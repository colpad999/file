<!DOCTYPE html><html><head><meta charset="utf-8"><title>Unrepost mockup</title>
<style>
body{margin:0;background:#050508;font-family:-apple-system,Roboto,Arial,sans-serif;color:#fff;padding:28px}
.gallery{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.phone{width:340px;height:700px;border-radius:34px;border:1px solid #2a2a35;background:#0B0B0F;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:20px;background:#0B0B0F;border-radius:0 0 14px 14px;z-index:9}
.frame{position:absolute;inset:0;overflow:hidden}
iframe{width:390px;height:816px;border:0;transform:scale(.872);transform-origin:0 0}
.cap{text-align:center;color:#9A9AA6;font-size:12.5px;margin:10px 0 22px}
h1{font-size:18px;margin:0 0 4px;text-align:center}
p.sub{text-align:center;color:#9A9AA6;font-size:13px;margin:0 0 26px}
</style></head>
<body>
<h1>Unrepost — tampilan situs di dalam APK</h1>
<p class="sub">Mockup statis (tanpa jaringan). Kiri: login · Kanan: dashboard</p>
<div class="gallery">
  <div><div class="phone"><div class="notch"></div><div class="frame">
    <iframe src="../app/assets/web/index.html?mock=login"></iframe>
  </div></div><div class="cap">Login — tanpa lewat Setelan</div></div>
  <div><div class="phone"><div class="notch"></div><div class="frame">
    <iframe src="../app/assets/web/index.html?mock=app"></iframe>
  </div></div><div class="cap">Dashboard — satu klik bersihkan</div></div>
</div>
</body></html>
